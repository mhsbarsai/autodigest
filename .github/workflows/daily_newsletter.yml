name: AutoDigest Daily Automation

on:
  schedule:
    # Runs everyday at 23:00 UTC (06:00 AM WIB - Western Indonesia Time)
    - cron: '0 23 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit updated cache back to repository

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AutoDigest Daily Newsletter Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          DISTRIBUTION_PROVIDER: ${{ secrets.DISTRIBUTION_PROVIDER || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'Creavora <newsletter@creavora.my.id>' }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          NEWSLETTER_NAME: ${{ secrets.NEWSLETTER_NAME || 'Creavora' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python scripts/run_daily.py

      - name: Upload Daily Edition & Social Teasers Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-artifacts
          path: |
            output/latest_preview.html
            output/today_social_teasers.md
          retention-days: 14

      - name: Commit Seen Articles Cache & Web Archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_articles.json docs/
          git commit -m "chore(cache): update seen articles cache, web archive and RSS feed [skip ci]" || echo "No changes to commit"
          git push
